{% extends "base.html" %}
{% block title %}Đăng nhập · LAN-LMS{% endblock %}
{% block body %}
<main class="login-shell ui-page min-h-screen flex items-center justify-center p-6 bg-slate-50">
  <section class="login-card auth-card ui-card w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <div class="brand-mark"><i class="fa fa-laptop"></i></div>
    <h1>LAN-LMS</h1>
    <p class="muted">Đăng nhập để truy cập hệ thống học tập và quản lý khóa học của bạn.</p>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form action="/login" method="post" class="stack-form ui-form">
      <input name="next" type="hidden" value="{{ next|default('') }}">
      <label for="username">MSSV / Tài khoản Admin</label>
      <input id="username" name="username" autocomplete="username" maxlength="80" required autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-wide ui-action" type="submit"><i class="fa fa-sign-in"></i> Đăng nhập</button>
    </form>
    
  </section>
</main>
{% endblock %}
